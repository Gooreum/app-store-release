# __BRANCH__에 릴리스 커밋이 오면 App Store Connect에 올린다. 심사 제출은 사람이 한다.
#
# 릴리스 커밋은 app-store-release 스킬이 만든다 (https://github.com/Gooreum/app-store-release).
# 일반 머지는 아래 경로를 건드리지 않으므로 이 워크플로가 돌지 않는다.
#
#   빌드 번호가 바뀜          → 아카이브 → 업로드 → 태그 v<버전>-<빌드>
#   fastlane/metadata 바뀜    → 앱 정보 반영
#   fastlane/screenshots 바뀜 → 스크린샷 교체
#
# 앱 정보는 새 버전을 올리는 릴리스 커밋과 함께 바꾼다. 이미 판매 중인 버전 그대로
# 앱 정보만 바꿔 푸시하면 deliver가 고칠 수 있는 버전을 찾지 못해 실패할 수 있다.
#
# 시크릿: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8(.p8 파일을 base64로). 키 권한은 Admin이어야
# 한다 — CI에는 Xcode 계정이 없어 그 키로 프로파일을 받는다.
# CERT_DEV_P12, CERT_DIST_P12(이미 있는 개발·배포 인증서 .p12를 base64로), CERT_P12_PASSWORD.
# 인증서를 주지 않으면 Xcode가 실행마다 개발 인증서를 새로 만들어 계정 한도에 걸린다.
name: App Store

on:
  push:
    branches: [__BRANCH__]
    paths:
      - __VERSION_FILE__
      - fastlane/metadata/**
      - fastlane/screenshots/**
  workflow_dispatch:
    inputs:
      build:
        description: 아카이브·업로드
        type: boolean
        default: false
      dry_run:
        description: 업로드하지 않고 서명까지만 (build와 함께). 앱 정보·스크린샷도 반영하지 않는다
        type: boolean
        default: false
      metadata:
        description: 앱 정보 반영
        type: boolean
        default: false
      screenshots:
        description: 스크린샷 교체
        type: boolean
        default: false

# 두 릴리스가 동시에 올라가면 번호·앱 정보가 엇갈린다. 앞의 것을 끝까지 둔다.
# 대기는 최신 1건만 남는다(GitHub 동작). 릴리스 커밋을 연달아 푸시하지 말고, 빠졌으면 손으로 다시 돌린다.
concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: __RUNNER__
    timeout-minutes: 60
    # shell을 적지 않으면 pipefail 없이 돈다. "무엇을 올릴지"의 파이프(| tee)가 실패를 삼키지 않게 한다.
    defaults:
      run:
        shell: bash
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/../AuthKey.p8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 무엇을 올릴지
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            bash scripts/app-store/release-diff.sh HEAD HEAD | grep -E '^(version|build_number)='
            echo "build=${{ inputs.build }}"
            echo "metadata=${{ inputs.metadata }}"
            echo "screenshots=${{ inputs.screenshots }}"
          else
            # 브랜치를 새로 만든 푸시면 before가 0으로 온다
            base="$BEFORE"; git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
            bash scripts/app-store/release-diff.sh "$base" HEAD
          fi > "$RUNNER_TEMP/plan"
          # 이미 태그가 있는 빌드는 올라간 것이다. 다시 돌려도(Re-run) 같은 번호로 또 올리지 않는다.
          # dry_run은 올리지 않으니 서명 확인은 그대로 돈다.
          . "$RUNNER_TEMP/plan" 2>/dev/null || true
          if [ "${build:-}" = true ] && [ "$DRY_RUN" != true ] && git rev-parse -q --verify "refs/tags/v$version-$build_number" >/dev/null; then
            echo "태그 v$version-$build_number 있음 — 빌드는 건너뜀"
            sed -i '' 's/^build=true$/build=false/' "$RUNNER_TEMP/plan"
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/plan"

      # 손으로 돌릴 때 다른 브랜치를 고를 수 있다. App Store Connect에 올리고 반영하는 건 __BRANCH__만,
      # 다른 브랜치는 dry_run만 된다. 키를 풀기 전에 막는다.
      - name: 브랜치 확인
        if: (steps.plan.outputs.build == 'true' || steps.plan.outputs.metadata == 'true' || steps.plan.outputs.screenshots == 'true') && !inputs.dry_run && github.ref != 'refs/heads/__BRANCH__'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::__BRANCH__가 아닌 브랜치($REF_NAME)는 올리지 않는다. dry_run으로만 돌린다"
          exit 1

      # 외부 도구·패키지를 받는 동안에는 키가 디스크에 없게 키보다 먼저 한다
      - name: 프로젝트 준비
        if: steps.plan.outputs.build == 'true'
        run: |
          xcodebuild -version
          . scripts/app-store/lib.sh
          setup=$(cfg ci.setup)
          [ -z "$setup" ] || bash -c "$setup"

      - name: fastlane 준비
        if: (steps.plan.outputs.metadata == 'true' || steps.plan.outputs.screenshots == 'true') && !inputs.dry_run
        run: command -v fastlane >/dev/null || brew install fastlane

      - name: API 키
        if: steps.plan.outputs.build == 'true' || steps.plan.outputs.metadata == 'true' || steps.plan.outputs.screenshots == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
            || { echo "::error::시크릿 ASC_KEY_P8·ASC_KEY_ID·ASC_ISSUER_ID가 필요하다"; exit 1; }
          echo "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      # 이미 있는 개발·배포 인증서를 러너 키체인에 넣는다. 없으면 Xcode가 API 키로 개발 인증서를
      # 실행마다 새로 만들어 계정 한도에 걸린다("Choose a certificate to revoke").
      - name: 서명 인증서
        if: steps.plan.outputs.build == 'true'
        env:
          CERT_DEV_P12: ${{ secrets.CERT_DEV_P12 }}
          CERT_DIST_P12: ${{ secrets.CERT_DIST_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          [ -n "$CERT_DEV_P12" ] && [ -n "$CERT_DIST_P12" ] && [ -n "$CERT_P12_PASSWORD" ] \
            || { echo "::error::시크릿 CERT_DEV_P12·CERT_DIST_P12·CERT_P12_PASSWORD가 필요하다(없으면 인증서가 새로 생긴다)"; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          KC="$RUNNER_TEMP/signing.keychain-db"; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          for v in CERT_DEV_P12 CERT_DIST_P12; do
            printf '%s' "${!v}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ids=$(security find-identity -v -p codesigning "$KC")
          team=$(. scripts/app-store/lib.sh; cfg team_id)
          if ! grep -q "Apple Development" <<<"$ids" || ! grep -q "Apple Distribution: .*($team)" <<<"$ids"; then
            echo "::error::개발·배포 인증서가 둘 다 유효하게 들어가야 한다(빠지면 Xcode가 새로 만든다)"
            security find-identity -p codesigning "$KC"; exit 1
          fi

      - name: 아카이브·업로드
        if: steps.plan.outputs.build == 'true'
        env:
          DESTINATION: ${{ inputs.dry_run && 'export' || 'upload' }}
        run: bash scripts/app-store/archive-upload.sh

      # 업로드가 끝나면 바로 찍는다. 뒤 단계(앱 정보)가 실패해도 같은 빌드를 다시 올리지 않게.
      - name: 태그
        if: steps.plan.outputs.build == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.build_number }}
        run: |
          tag="v$VERSION-$BUILD_NUMBER"
          # 같은 빌드를 다시 돌리면 태그가 이미 있다
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "태그 $tag 있음 — 건너뜀"; else git tag "$tag" && git push origin "$tag"; fi

      - name: 앱 정보·스크린샷
        if: (steps.plan.outputs.metadata == 'true' || steps.plan.outputs.screenshots == 'true') && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SCREENSHOTS: ${{ steps.plan.outputs.screenshots }}
        run: |
          fastlane metadata screenshots:"$SCREENSHOTS" version:"$VERSION"

      - name: 키 지우기
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
